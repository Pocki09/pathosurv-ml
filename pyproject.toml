[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pathosurv"
version = "0.1.0"
description = "PathoSurv Lite — data and training pipeline for WSI survival modeling"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "scikit-survival>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyter>=1.0"]
wsi = ["openslide-python>=1.3", "opencv-python-headless>=4.8", "Pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pathosurv*", "data_tools*", "models*", "losses*", "evaluation*", "training*", "packaging*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
