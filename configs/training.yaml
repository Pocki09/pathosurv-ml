# Training hyperparameters (AdamW, early stopping on validation C-index)
optimizer: AdamW
early_stopping_metric: validation_c_index
max_epochs: 100
seed: 42
learning_rate: 1.0e-4
weight_decay: 1.0e-4
patience: 15
batch_size: 8

# Patient-level split (stratified on event_status; test + val ratios must sum to < 1.0)
split:
  test_ratio: 0.15
  validation_ratio: 0.15
